version: '3.8'

networks:
  wtc_cap_one:
    driver: bridge

volumes:
  redpanda-0: null
  redpanda-1: null
  redpanda-2: null
  postgres_persistence: null

services:
  # Infrastructure services
  postgres:
    build: ./pgsql
    container_name: postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s           # Time between running the check
      timeout: 60s            # Time after which the check is considered failed if no response
      retries: 50              # How many times to retry before marking the service as unhealthy
      start_period: 10s       # Start period before the first check is run
    volumes:
      - ./volumes/data/postgres/var/lib/postgresql/data:/var/lib/postgresql/data
      - ./volumes/config/postgres/var/lib/postgresql/data/postgresql.conf:/etc/postgresql/postgresql.conf
    networks:
      - wtc_cap_one
    ports:
      - "15432:5432"
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 60s
      resources:
        limits:
          cpus: "2.0"
          memory: "1g"
        reservations:
          cpus: "2"
          memory: "512m"

  sftp:
    image: "emberstack/sftp"
    container_name: sftp
    networks:
      - wtc_cap_one
    ports:
      - "10022:22"
    volumes:
      - ./volumes/data/sftp/home/cdr_data:/home/cdr_data
      - ./volumes/config/sftp/config.json:/app/config/sftp.json:ro
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "128m"
        reservations:
          cpus: "0.5"
          memory: "128m"

  redpanda-0:
    command:
      - redpanda
      - start
      - --overprovisioned
      - --memory
      - 512M
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      # Address the broker advertises to clients that connect to the Kafka API.
      # Use the internal addresses to connect to the Redpanda brokers'
      # from inside the same Docker network.
      # Use the external addresses to connect to the Redpanda brokers'
      # from outside the Docker network.
      - --advertise-kafka-addr internal://redpanda-0:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      # Address the broker advertises to clients that connect to the HTTP Proxy.
      - --advertise-pandaproxy-addr internal://redpanda-0:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      # Redpanda brokers use the RPC API to communicate with each other internally.
      - --rpc-addr redpanda-0:33145
      - --advertise-rpc-addr redpanda-0:33145
      # Mode dev-container uses well-known configuration properties for development in containers.
      - --mode dev-container
      # Tells Seastar (the framework Redpanda uses under the hood) to use 1 core on the system.
      - --smp 1
      - --default-log-level=info
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: redpanda-0
    volumes:
      - type: tmpfs
        target: /var/lib/redpanda/data
        tmpfs:
          mode: 0777
      - ./volumes/config/redpanda/redpanda-0/etc/redpanda:/etc/redpanda
    networks:
      - wtc_cap_one
    ports:
      - 18081:18081
      - 18082:18082
      - 19092:19092
      - 19644:9644
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s           # Time between running the check
      timeout: 60s            # Time after which the check is considered failed if no response
      retries: 50              # How many times to retry before marking the service as unhealthy
      start_period: 10s
      
  redpanda-1:
    command:
      - redpanda
      - start
      - --overprovisioned
      - --memory 
      - 512M
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr internal://redpanda-1:9092,external://localhost:29092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:28082
      - --advertise-pandaproxy-addr internal://redpanda-1:8082,external://localhost:28082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:28081
      - --rpc-addr redpanda-1:33145
      - --advertise-rpc-addr redpanda-1:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
      - --seeds redpanda-0:33145
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: redpanda-1
    volumes:
      - type: tmpfs
        target: /var/lib/redpanda/data
        tmpfs:
          mode: 0777
      - ./volumes/config/redpanda/redpanda-1/etc/redpanda:/etc/redpanda
    networks:
      - wtc_cap_one
    ports:
      - 28081:28081
      - 28082:28082
      - 29092:29092
      - 29644:9644
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s           # Time between running the check
      timeout: 60s            # Time after which the check is considered failed if no response
      retries: 50              # How many times to retry before marking the service as unhealthy
      start_period: 10s
    depends_on:
      - redpanda-0

  redpanda-2:
    command:
      - redpanda
      - start
      - --overprovisioned
      - --memory 
      - 512M
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:39092
      - --advertise-kafka-addr internal://redpanda-2:9092,external://localhost:39092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:38082
      - --advertise-pandaproxy-addr internal://redpanda-2:8082,external://localhost:38082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:38081
      - --rpc-addr redpanda-2:33145
      - --advertise-rpc-addr redpanda-2:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
      - --seeds redpanda-0:33145
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: redpanda-2
    volumes:
      - type: tmpfs
        target: /var/lib/redpanda/data
        tmpfs:
          mode: 0777
      - ./volumes/config/redpanda/redpanda-2/etc/redpanda:/etc/redpanda
    networks:
      - wtc_cap_one
    ports:
      - 38081:38081
      - 38082:38082
      - 39092:39092
      - 39644:9644
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s           # Time between running the check
      timeout: 60s            # Time after which the check is considered failed if no response
      retries: 50              # How many times to retry before marking the service as unhealthy
      start_period: 10s
    depends_on:
      - redpanda-0
  console:
    container_name: redpanda-console
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    networks:
      - wtc_cap_one
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda-0:9092"]
          schemaRegistry:
            enabled: true
            urls: ["http://redpanda-0:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda-0:9644"]
    ports:
      - 18084:8080
    depends_on:
      - redpanda-0

  # Data generators
  forex:
    build: ./forex
    container_name: forex
    networks:
      - wtc_cap_one
    depends_on:
      redpanda-0:
        condition: service_healthy
      redpanda-1:
        condition: service_healthy
      redpanda-2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "128m"
        reservations:
          cpus: "0.25"
          memory: "64m"

  # Python App - CDR
  cdr:
    build: ./cdr
    container_name: cdr
    networks:
      - wtc_cap_one
    depends_on:
      postgres:
        condition: service_healthy
      sftp:                        # ADD THIS
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "128m"
        reservations:
          cpus: "0.5"
          memory: "64m"

  # Python App - CDR
  crm:
    build: ./crm
    container_name: crm
    networks:
      - wtc_cap_one
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "128m"
        reservations:
          cpus: "0.25"
          memory: "64m"

  #############################
  # Add you containers etc here #
  #############################

  debezium:
    image: debezium/connect:2.4
    container_name: debezium
    networks:
      - wtc_cap_one
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: redpanda-0:9092
      GROUP_ID: debezium-crm
      CONFIG_STORAGE_TOPIC: debezium.configs
      OFFSET_STORAGE_TOPIC: debezium.offsets
      STATUS_STORAGE_TOPIC: debezium.status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

    depends_on:
      postgres:
        condition: service_healthy
      redpanda-0:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 60s
      retries: 50
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1g"
        reservations:
          cpus: "0.5"
          memory: "512m"
  sftp_consumer:
    build: ./sftp_consumer
    container_name: sftp_consumer
    networks:
      - wtc_cap_one
    depends_on:
      - sftp
      - cdr
    volumes:
      - ./volumes/data/sftp_consumer/staging:/app/staging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256m"
        reservations:
          cpus: "0.25"
          memory: "128m"
  
  # Postgres Persistance
  postgres_persistence:
    build: ./pgsql_persistance
    container_name: postgres_persistence
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telecom_platform
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 60s
      retries: 50
      start_period: 10s
    volumes:
      - postgres_persistence:/var/lib/postgresql/data
    networks:
      - wtc_cap_one
    ports:
      - "25432:5432"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512m"
        reservations:
          cpus: "0.5"
          memory: "256m"

  cdr_consumer:
    build: ./cdr_consumer
    container_name: cdr_consumer
    networks:
      - wtc_cap_one
    depends_on:
      redpanda-0:
        condition: service_healthy
      redpanda-1:
        condition: service_healthy
      redpanda-2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256m"
        reservations:
          cpus: "0.25"
          memory: "128m"

  stream_processor:
    build: ./stream_processor
    container_name: stream_processor
    networks:
      - wtc_cap_one
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-0:
        condition: service_healthy
      redpanda-1:
        condition: service_healthy
      redpanda-2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "256m"
        reservations:
          cpus: "0.5"
          memory: "128m"

  usage_api:
    build: ./usage_api
    container_name: usage_api
    networks:
      - wtc_cap_one
    ports:
      - "18089:8000"
    environment:
      - API_USERNAME=admin
      - API_PASSWORD=admin
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "128m"
        reservations:
          cpus: "0.25"
          memory: "64m"

  # Persistence Consumer
  persistence_layer:
    build: ./persistence_layer
    container_name: persistence_layer
    environment:
      KAFKA_BROKERS: redpanda-0:9092,redpanda-1:9092,redpanda-2:9092
      DB_HOST: postgres_persistence
      DB_PORT: 5432
      DB_NAME: telecom_platform
      DB_USER: postgres
      DB_PASS: postgres
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f persistence_consumer.py || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - wtc_cap_one
    depends_on:
      postgres_persistence:
        condition: service_healthy
      redpanda-0:
        condition: service_healthy
      redpanda-1:
        condition: service_healthy
      redpanda-2:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 60s
      resources:
        limits:
          cpus: "0.5"
          memory: "256m"
        reservations:
          cpus: "0.25"
          memory: "128m"